[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "poliseye"
version = "0.2.0"
description = "Forecasting and understanding human presence and travel behaviour from aggregated mobile phone data."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alket Cecaj", email = "alket.cecaj@gmail.com" }]
keywords = [
    "sustainable mobility",
    "travel behaviour",
    "mobile phone data",
    "crowd forecasting",
    "time series",
    "smart cities",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
deep = ["tensorflow>=2.15"]
viz = ["matplotlib>=3.7", "seaborn>=0.13"]
geo = ["geopandas>=0.14", "folium>=0.15"]
notebooks = ["jupyterlab>=4", "matplotlib>=3.7", "seaborn>=0.13"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
poliseye = "poliseye.cli:main"

[project.urls]
Project = "https://www.poliseye.it/"
Repository = "https://github.com/alketcecaj12/PolisEye_Experimentation"
Paper = "https://doi.org/10.3390/app10186580"

[tool.hatch.build.targets.wheel]
packages = ["src/poliseye"]

[tool.hatch.build.targets.sdist]
include = ["src/poliseye", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::statsmodels.tools.sm_exceptions.ConvergenceWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
